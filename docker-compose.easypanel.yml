# EasyPanel'e "Compose" servisi olarak içe aktarmak için üretim dosyası.
# Yerel geliştirme için docker-compose.yml (sadece Postgres) kullanılmaya
# devam eder -- bu dosya web + worker + db'yi birlikte tanımlar.
#
# EasyPanel'de proje env değişkenleri (Environment sekmesi) üzerinden
# aşağıdaki ${...} değerlerini doldurun: POSTGRES_PASSWORD, AUTH_PASSWORD
# (webapp girişi -- boş bırakılırsa webapp kimseye açılmaz), AUTH_USERNAME
# (opsiyonel, varsayılan admin), SCRAPE_CONCURRENCY (opsiyonel, varsayılan 2),
# PROXY_LIST (opsiyonel, varsayılan boş).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: maps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: maps_scraper
    volumes:
      - maps_pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://maps:${POSTGRES_PASSWORD}@db:5432/maps_scraper
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-2}
      SCRAPE_DELAY_MIN_MS: ${SCRAPE_DELAY_MIN_MS:-1200}
      SCRAPE_DELAY_MAX_MS: ${SCRAPE_DELAY_MAX_MS:-3500}
      HEADLESS: "true"
      PROXY_LIST: ${PROXY_LIST:-}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
    ports:
      - "8501:8501"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    command: ["python", "-m", "maps_scraper.cli", "run"]
    environment:
      DATABASE_URL: postgresql+asyncpg://maps:${POSTGRES_PASSWORD}@db:5432/maps_scraper
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-2}
      SCRAPE_DELAY_MIN_MS: ${SCRAPE_DELAY_MIN_MS:-1200}
      SCRAPE_DELAY_MAX_MS: ${SCRAPE_DELAY_MAX_MS:-3500}
      HEADLESS: "true"
      PROXY_LIST: ${PROXY_LIST:-}

volumes:
  maps_pgdata:
